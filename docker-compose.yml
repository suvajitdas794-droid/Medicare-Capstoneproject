services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medicare_db}
      MYSQL_USER: ${MYSQL_USER:-medicare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-db-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-p${MYSQL_ROOT_PASSWORD:-change-this-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [medicare]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/medicare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USERNAME: ${DB_USERNAME:-medicare}
      DB_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-random-secret-at-least-32-characters-long}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@medicare.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      USER_EMAIL: ${USER_EMAIL:-user@medicare.local}
      USER_PASSWORD: ${USER_PASSWORD:-User@12345}
    depends_on:
      mysql:
        condition: service_healthy
    ports: ["8080:8080"]
    networks: [medicare]
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["4200:80"]
    networks: [medicare]
volumes:
  mysql_data:
networks:
  medicare:
