server:
  port: 8080
spring:
  application:
    name: medicare-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/medicare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:Suvajit}
    password: ${DB_PASSWORD:Mickey@152005}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-change-me-12345678901234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  demo:
    admin-email: ${ADMIN_EMAIL:admin@medicare.local}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
    user-email: ${USER_EMAIL:user@medicare.local}
    user-password: ${USER_PASSWORD:User@12345}
